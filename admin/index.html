<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — meoponly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F5F5F0; color: #1E1E1E; }
    .font-serif-claude { font-family: 'Newsreader', Georgia, serif; }
  </style>
</head>
<body class="p-6 md:p-12 max-w-4xl mx-auto">

  <div class="flex items-center justify-between border-b border-[#E2DFD8] pb-6 mb-8">
    <div>
      <h1 class="text-3xl font-serif-claude font-normal">Project Manager</h1>
      <p class="text-sm text-[#7D786F]">Add, edit, reorder or remove portfolio projects live.</p>
    </div>
    <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-[#D5D0C5] hover:bg-[#EAE7DF] transition">
      <i class="fa-solid fa-arrow-left mr-1"></i> Back to Site
    </a>
  </div>

  <!-- Form -->
  <div class="bg-[#ECE9E1] border border-[#DDD8CD] rounded-2xl p-6 mb-10 shadow-sm">
    <h2 class="text-base font-semibold text-[#2D2A26] mb-4" id="form-heading">Add New Project</h2>
    <form id="project-form" class="space-y-4">
      <input type="hidden" id="edit-id" value="">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs uppercase tracking-wider font-semibold text-[#7D786F] mb-1">Title</label>
          <input type="text" id="title" required placeholder="e.g. IOQM Pro" class="w-full px-3 py-2 text-sm bg-white border border-[#D5D0C5] rounded-lg focus:outline-none focus:ring-1 focus:ring-[#C15F3D]">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider font-semibold text-[#7D786F] mb-1">Category / Type</label>
          <input type="text" id="category" placeholder="e.g. Education, Web App, Tool" class="w-full px-3 py-2 text-sm bg-white border border-[#D5D0C5] rounded-lg focus:outline-none focus:ring-1 focus:ring-[#C15F3D]">
        </div>
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wider font-semibold text-[#7D786F] mb-1">Description</label>
        <textarea id="desc" rows="2" required placeholder="What does this project do?" class="w-full px-3 py-2 text-sm bg-white border border-[#D5D0C5] rounded-lg focus:outline-none focus:ring-1 focus:ring-[#C15F3D]"></textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs uppercase tracking-wider font-semibold text-[#7D786F] mb-1">Live URL</label>
          <input type="url" id="link" placeholder="https://..." class="w-full px-3 py-2 text-sm bg-white border border-[#D5D0C5] rounded-lg focus:outline-none focus:ring-1 focus:ring-[#C15F3D]">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider font-semibold text-[#7D786F] mb-1">GitHub Repo URL</label>
          <input type="url" id="repo" placeholder="https://github.com/..." class="w-full px-3 py-2 text-sm bg-white border border-[#D5D0C5] rounded-lg focus:outline-none focus:ring-1 focus:ring-[#C15F3D]">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs uppercase tracking-wider font-semibold text-[#7D786F] mb-1">Tech Tags (comma separated)</label>
          <input type="text" id="tags" placeholder="e.g. JavaScript, Tailwind, API" class="w-full px-3 py-2 text-sm bg-white border border-[#D5D0C5] rounded-lg focus:outline-none focus:ring-1 focus:ring-[#C15F3D]">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider font-semibold text-[#7D786F] mb-1">Display Order (1 = first)</label>
          <input type="number" id="order" value="1" class="w-full px-3 py-2 text-sm bg-white border border-[#D5D0C5] rounded-lg focus:outline-none focus:ring-1 focus:ring-[#C15F3D]">
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button type="submit" class="px-5 py-2 text-sm font-semibold text-white bg-[#C15F3D] hover:bg-[#a84f32] rounded-lg transition shadow-sm">
          Save Project
        </button>
        <button type="button" id="cancel-edit" class="hidden px-4 py-2 text-sm font-semibold text-[#666] bg-transparent border border-[#DDD] hover:bg-[#DDD] rounded-lg transition">
          Cancel
        </button>
      </div>
    </form>
  </div>

  <!-- Live List -->
  <h2 class="text-lg font-serif-claude font-normal mb-4">Current Projects in Database</h2>
  <div id="admin-project-list" class="space-y-3">
    <p class="text-sm text-[#7D786F]">Loading projects from Firebase...</p>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    // PASTE YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_DATABASE_NAME.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const projectsRef = ref(db, 'projects');

    const form = document.getElementById('project-form');
    const listEl = document.getElementById('admin-project-list');
    const editIdInput = document.getElementById('edit-id');
    const cancelBtn = document.getElementById('cancel-edit');
    const heading = document.getElementById('form-heading');

    let currentProjects = {};

    onValue(projectsRef, (snapshot) => {
      const data = snapshot.val() || {};
      currentProjects = data;
      renderAdminList(data);
    });

    function renderAdminList(data) {
      const items = Object.entries(data).map(([id, val]) => ({ id, ...val }));
      items.sort((a, b) => (Number(a.order) || 99) - (Number(b.order) || 99));

      if (items.length === 0) {
        listEl.innerHTML = `<p class="text-sm text-[#7D786F]">No projects stored yet. Add your first project above.</p>`;
        return;
      }

      listEl.innerHTML = items.map(p => `
        <div class="bg-white border border-[#E2DFD8] p-4 rounded-xl flex items-center justify-between shadow-2xs">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono bg-[#EAE7DF] text-[#7D786F] px-1.5 py-0.5 rounded">#${p.order || '-'}</span>
              <h3 class="font-medium text-sm text-[#1E1E1E]">${p.title}</h3>
              <span class="text-xs text-[#7D786F]">• ${p.category || 'General'}</span>
            </div>
            <p class="text-xs text-[#5C5850] mt-1 line-clamp-1">${p.desc}</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="window.editProject('${p.id}')" class="text-xs px-2.5 py-1.5 bg-[#F5F5F0] hover:bg-[#EAE7DF] rounded-md transition text-[#1E1E1E]">Edit</button>
            <button onclick="window.deleteProject('${p.id}')" class="text-xs px-2.5 py-1.5 text-red-600 hover:bg-red-50 rounded-md transition">Delete</button>
          </div>
        </div>
      `).join('');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = editIdInput.value;
      const projectData = {
        title: document.getElementById('title').value.trim(),
        category: document.getElementById('category').value.trim(),
        desc: document.getElementById('desc').value.trim(),
        link: document.getElementById('link').value.trim(),
        repo: document.getElementById('repo').value.trim(),
        tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean),
        order: Number(document.getElementById('order').value) || 1
      };

      if (id) {
        update(ref(db, `projects/${id}`), projectData).then(resetForm);
      } else {
        const newRef = push(projectsRef);
        set(newRef, projectData).then(resetForm);
      }
    });

    window.editProject = (id) => {
      const p = currentProjects[id];
      if (!p) return;
      editIdInput.value = id;
      document.getElementById('title').value = p.title || '';
      document.getElementById('category').value = p.category || '';
      document.getElementById('desc').value = p.desc || '';
      document.getElementById('link').value = p.link || '';
      document.getElementById('repo').value = p.repo || '';
      document.getElementById('tags').value = (p.tags || []).join(', ');
      document.getElementById('order').value = p.order || 1;
      heading.innerText = `Edit: ${p.title}`;
      cancelBtn.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteProject = (id) => {
      if (confirm('Delete this project?')) {
        remove(ref(db, `projects/${id}`));
      }
    };

    function resetForm() {
      form.reset();
      editIdInput.value = '';
      heading.innerText = 'Add New Project';
      cancelBtn.classList.add('hidden');
    }

    cancelBtn.addEventListener('click', resetForm);
  </script>
</body>
</html>
