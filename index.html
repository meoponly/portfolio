<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meoponly — student & developer</title>
  
  <!-- Favicon using GitHub avatar + fallback -->
  <link rel="icon" type="image/png" href="https://github.com/meoponly.png">
  <link rel="apple-touch-icon" href="https://github.com/meoponly.png">
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Claude-style Typography: Newsreader (Editorial Serif) & Plus Jakarta Sans (Clean UI Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #F5F5F0;
      color: #1E1E1E;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-serif-claude {
      font-family: 'Newsreader', Georgia, serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .card-claude {
      background: #FFFFFF;
      border: 1px solid #E5E2DA;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-claude:hover {
      border-color: #C15F3D;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.05);
    }
    .pill-link {
      background: #ECE9E1;
      border: 1px solid #D5D0C5;
      transition: all 0.15s ease;
    }
    .pill-link:hover {
      background: #E2DFD6;
      border-color: #BDB7AA;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#C15F3D] selection:text-white">

  <!-- Main Content Container -->
  <main class="max-w-5xl mx-auto px-6 py-12 md:py-16 w-full">

    <!-- Profile Header -->
    <header class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6 pb-10 border-b border-[#E2DFD8]">
      <div class="flex items-center gap-5">
        <img 
          src="https://github.com/meoponly.png" 
          alt="meoponly profile" 
          class="w-20 h-20 rounded-full border-2 border-[#D5D0C5] shadow-xs object-cover"
          onerror="this.src='https://ui-avatars.com/api/?name=meoponly&background=C15F3D&color=fff&size=128'"
        >
        <div>
          <div class="flex items-center gap-3">
            <h1 class="text-3xl md:text-4xl font-serif-claude font-normal tracking-tight text-[#1E1E1E]">meoponly</h1>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-mono-code bg-[#EAE7DF] text-[#635E55] border border-[#DDD8CD]">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> student & builder
            </span>
          </div>
          <p class="text-sm md:text-base text-[#615C53] mt-1 font-serif-claude italic">
            Curious student exploring software, crafting minimal web apps & open tools.
          </p>
        </div>
      </div>

      <!-- Social Contact Pills -->
      <div class="flex items-center gap-2 flex-wrap">
        <a href="https://github.com/meoponly" target="_blank" rel="noopener" class="pill-link px-3 py-1.5 rounded-lg text-xs font-medium text-[#2E2B25] flex items-center gap-2">
          <i class="fa-brands fa-github text-sm"></i> GitHub
        </a>
        <a href="https://t.me/meoponly" target="_blank" rel="noopener" class="pill-link px-3 py-1.5 rounded-lg text-xs font-medium text-[#2E2B25] flex items-center gap-2">
          <i class="fa-brands fa-telegram text-sm"></i> Telegram
        </a>
        <a href="https://youtube.com/@meoponly" target="_blank" rel="noopener" class="pill-link px-3 py-1.5 rounded-lg text-xs font-medium text-[#2E2B25] flex items-center gap-2">
          <i class="fa-brands fa-youtube text-sm text-[#C15F3D]"></i> YouTube
        </a>
      </div>
    </header>

    <!-- Projects Section -->
    <section class="mt-12">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h2 class="text-2xl font-serif-claude font-normal text-[#1E1E1E]">Projects</h2>
          <p class="text-xs text-[#7D786F] mt-0.5">Selected experiments, utility apps, and open-source works.</p>
        </div>
        <a href="/admin" class="text-xs font-mono-code text-[#948F85] hover:text-[#C15F3D] transition">
          /admin
        </a>
      </div>

      <!-- 3-Column Project Grid -->
      <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Rendered dynamically from Firebase or static fallback -->
      </div>
    </section>

  </main>

  <!-- Clean Signature Footer -->
  <footer class="border-t border-[#E2DFD8] py-8 mt-16 text-center text-xs text-[#7A756D]">
    <div class="max-w-5xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-3">
      <p class="font-serif-claude italic text-sm text-[#545048]">
        "Crafting ideas one commit at a time."
      </p>
      <p class="font-mono-code text-[11px] text-[#918B80]">
        &copy; 2026 meoponly • All rights reserved
      </p>
    </div>
  </footer>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    // REPLACE WITH YOUR ACTUAL FIREBASE CONFIG KEYS
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_DATABASE_NAME.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Default static projects fallback
    const fallbackProjects = [
      {
        title: "IOQM Pro",
        desc: "A comprehensive, minimalist collection of chapters & lectures for IOQM preparation.",
        link: "https://meoponly.github.io/ioqm_pro/",
        repo: "https://github.com/meoponly",
        tags: ["Education", "Minimalist"]
      },
      {
        title: "pwmate",
        desc: "Free PhysicsWallah coupons aggregator for unlocking maximum course discounts.",
        link: "https://pw-mate.netlify.app/",
        repo: "",
        tags: ["Utility", "Coupons"]
      },
      {
        title: "pw pirates",
        desc: "Curated open-web movie catalog with a clean, responsive streaming interface.",
        link: "https://deadpool-pirates.vercel.app/",
        repo: "https://github.com/meoponly/deadpool-movies",
        tags: ["Web App", "Media"]
      },
      {
        title: "ewtube",
        desc: "Clean, distraction-free YouTube alternative web interface.",
        link: "https://meoponly.github.io/ewtube.com/",
        repo: "https://github.com/meoponly/ewtube.com",
        tags: ["Web App"]
      },
      {
        title: "yt4free",
        desc: "Cookie-free YouTube watcher for seamless, privacy-centric playback.",
        link: "https://yt4free.vercel.app/",
        repo: "https://github.com/meoponly/yt-premium-4free",
        tags: ["Privacy", "Video"]
      },
      {
        title: "pseudomation",
        desc: "Minimalist study tracker designed to keep focus clean and measured.",
        link: "https://pseudomation.vercel.app/",
        repo: "https://github.com/meoponly/nothing",
        tags: ["Productivity"]
      }
    ];

    const grid = document.getElementById('projects-grid');

    function renderCards(projects) {
      grid.innerHTML = projects.map(p => `
        <div class="card-claude p-5 rounded-2xl flex flex-col justify-between h-full">
          <div>
            <div class="flex items-start justify-between gap-2 mb-2">
              <h3 class="text-base font-semibold text-[#1E1E1E] tracking-tight">${p.title}</h3>
              <div class="flex items-center gap-2.5">
                ${p.repo ? `<a href="${p.repo}" target="_blank" rel="noopener" class="text-[#878279] hover:text-[#1E1E1E] text-sm transition" title="GitHub Repo"><i class="fa-brands fa-github"></i></a>` : ''}
                ${p.link ? `<a href="${p.link}" target="_blank" rel="noopener" class="text-[#878279] hover:text-[#C15F3D] text-xs transition" title="Live Preview"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>` : ''}
              </div>
            </div>
            <p class="text-xs leading-relaxed text-[#5A554D] mb-4">${p.desc}</p>
          </div>

          <div class="pt-3 border-t border-[#F0ECE1] flex items-center justify-between">
            <div class="flex flex-wrap gap-1.5">
              ${(p.tags || []).map(t => `<span class="text-[10px] font-mono-code px-2 py-0.5 rounded bg-[#F4F1EA] text-[#6D675E]">${t}</span>`).join('')}
            </div>
          </div>
        </div>
      `).join('');
    }

    // Try fetching live entries from Firebase Realtime Database
    try {
      if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const projectsRef = ref(db, 'projects');

        onValue(projectsRef, (snapshot) => {
          const val = snapshot.val();
          if (val) {
            const list = Object.entries(val).map(([id, item]) => ({ id, ...item }));
            list.sort((a, b) => (Number(a.order) || 99) - (Number(b.order) || 99));
            renderCards(list);
          } else {
            renderCards(fallbackProjects);
          }
        }, () => renderCards(fallbackProjects));
      } else {
        renderCards(fallbackProjects);
      }
    } catch (err) {
      console.warn("Using fallback local projects:", err);
      renderCards(fallbackProjects);
    }
  </script>
</body>
</html>
